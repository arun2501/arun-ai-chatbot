<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<head>
    <meta charset="UTF-8">
    <title>Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

</head>
<body>
<div class="container">
    <div class="chatbox">
        <div class="chatbox__support">
            <div class="chatbox__header">
                <div class="chatbox__image--header">
                  <img src="/static/images/TamilNadu_Logo.png" alt="தமிழ்நாடு அரசு சின்னம்" class="chatbox__image--header">
                </div>
                <div class="chatbox__content--header">
                    <h3 class="chatbox__heading--header">ஸ்மார்ட் e-PDS உதவி</h3>
                    <p class="chatbox__description--header">வணக்கம்! நான் தமிழ்நாடு ஸ்மார்ட் e-PDS AI உதவியாளர். </p>
                </div>
            </div>
            <div class="chatbox__messages">
                <div></div>
            </div>
            <div class="chatbox__footer">
                <input type="text" placeholder="உங்கள் கேள்வியை எழுதுங்கள்...">
                <button class="chatbox__send--footer send__button">அனுப்பு</button>
            </div>
        </div>
    </div>
</div>

    <script>
          $SCRIPT_ROOT = {{ request.script_root|tojson }};
    </script>
    <script type="text/javascript" src="{{ url_for('static', filename='app.js') }}"></script>
    <!-- <script src="./app.js"></script> -->

</body>
</html>
